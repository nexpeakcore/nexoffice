name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  packages:
    name: Package gate
    runs-on: [self-hosted, nexoffice]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check packages
        run: bun run --filter './packages/*' typecheck

      - name: Test
        run: bun run test

      - name: Check demo assets
        run: |
          bun scripts/create-demo-deck.ts
          bun run --filter './apps/demo' check:seeds
          git diff --exit-code -- apps/demo/public/betteroffice-demo.pptx

      - name: Check minimal Wasm features
        run: cargo check -p xlsx-wasm --target wasm32-unknown-unknown --no-default-features

      - name: Build
        run: bun run build:packages

      - name: Type check workspace
        run: bun run typecheck

  audit:
    name: Security audit
    runs-on: [self-hosted, nexoffice]
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Report all advisories
        run: bun audit
        continue-on-error: true

      - name: Fail on high or critical advisories
        run: bun audit --audit-level=high

  rust:
    name: Rust gate
    runs-on: [self-hosted, nexoffice]
    steps:
      - uses: actions/checkout@v7

      - name: Detect Rust workspace
        id: ws
        run: echo "present=$([ -f Cargo.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ws.outputs.present == 'true'
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        if: steps.ws.outputs.present == 'true'

      - name: Format check
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --check

      - name: Clippy
        if: steps.ws.outputs.present == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        if: steps.ws.outputs.present == 'true'
        run: cargo test

      # Optional features are only unified into `cargo test` while some other
      # workspace member enables them.
      - name: Test optional features
        if: steps.ws.outputs.present == 'true'
        run: cargo test -p betteroffice-drawingml --all-features

      - name: Package publishable crates
        if: steps.ws.outputs.present == 'true'
        run: node scripts/publish-crates.mjs --dry-run

      # Run as a plain binary rather than through cargo-deny-action, which is a
      # Docker container action and so refuses to start anywhere but Linux. The
      # version is the one that action pins, so the same advisories, licences,
      # bans and sources are enforced as before the runner moved.
      - name: Install cargo-deny
        if: steps.ws.outputs.present == 'true'
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: License and advisory gate
        if: steps.ws.outputs.present == 'true'
        run: cargo deny check bans licenses advisories sources
